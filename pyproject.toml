[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pawnix"
version = "0.1.1"
description = "A minimal curses chess client with Lichess API support"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Pawnix contributors" }]
dependencies = [
  "keyring>=25.6",
  "python-chess>=1.999",
]
keywords = ["chess", "lichess", "terminal", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment :: Board Games",
]

[project.scripts]
pawnix = "pawnix.cli:main"

[project.urls]
Homepage = "https://github.com/a-shygun/Pawnix"
Repository = "https://github.com/a-shygun/Pawnix"
Issues = "https://github.com/a-shygun/Pawnix/issues"

[tool.setuptools.packages.find]
where = ["src"]
